services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # For development, disable security
    ports:
      - "9200:9200"
    networks:
      - elastic-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false # For development, disable security
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elastic-network

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.17.1
    container_name: apm-server
    environment:
      - APM_SERVER_KIBANA_HOST=kibana:5601
      - APM_SERVER_OUTPUT_ELASTICSEARCH_HOSTS=elasticsearch:9200
      - xpack.security.enabled=false # For development, disable security
    ports:
      - "8200:8200" # APM Server intake port
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - elastic-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1 # Or a specific Elastic OTel Collector image
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml # Mount your OTel Collector config
    ports:
      - "4317:4317" # OTLP gRPC receiver
    depends_on:
      - apm-server # Or directly elasticsearch if configured
    networks:
      - elastic-network

networks:
  elastic-network:
    driver: bridge